<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oshada Pramod</title>
  <meta name="description" content="Portfolio of Oshada Pramod – DevOps & Cloud Engineering projects, skills, certifications and contact." />
  <!-- Preconnects for potential CDNs (images / emailjs) -->
  <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- Preload critical hero image to improve LCP -->
  <link rel="preload" as="image" href="/src/assets/hero-image.png" fetchpriority="high" />
  <!-- Fallback preload for production build (hero copied to public/) -->
  <link rel="preload" as="image" href="/hero-image.png" media="(max-width: 2400px)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
  <!-- Removed long-term immutable Cache-Control during development to allow HMR updates. Re-add (on build output only) if needed for production. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Only register service worker in production builds.
      if (import.meta.env.PROD && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
